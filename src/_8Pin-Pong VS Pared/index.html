<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong vs Pared</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #10131f;
            margin: 0;
            color: white;
            font-family: sans-serif;
            flex-direction: column;
        }
        /* Contenedor para poner las pantallas (inicio / pausa / opciones / fin) encima del canvas */
        .tablero {
            position: relative;
            width: 800px;
            max-width: 100%;
        }
        canvas {
            display: block;
            width: 100%;
            /* Fondo del tablero: el color final lo pone game.js según las opciones */
            background: linear-gradient(135deg, #0b6e4f 0%, #08513a 100%);
            border: 3px solid #f5f5f5;
            border-radius: 6px;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.15);
        }
        kbd {
            background: #2d3348;
            border: 1px solid #555;
            border-radius: 4px;
            padding: 2px 8px;
            color: #fff;
            font-weight: bold;
        }

        /* Barra debajo del tablero: instrucciones y botón de pausa */
        .barra {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            width: 800px;
            max-width: 100%;
            margin-top: 12px;
            color: #aaa;
        }
        .barra p {
            margin: 0;
        }
        .barra button {
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* Pantallas superpuestas */
        .pantalla {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 12px;
            background: rgba(10, 14, 25, 0.88);
            border-radius: 6px;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .oculto {
            display: none;
        }
        .pantalla h3 {
            margin: 0;
            font-size: 28px;
        }
        .pantalla form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 260px;
        }
        .pantalla label {
            text-align: left;
            font-size: 14px;
            color: #ccc;
        }
        .pantalla input,
        .pantalla select {
            padding: 9px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #555;
            background: #1c2135;
            color: #fff;
        }
        .pantalla input[type="color"] {
            width: 100%;
            box-sizing: border-box;
            padding: 2px;
            height: 38px;
            cursor: pointer;
        }
        .opciones-grid {
            display: grid;
            grid-template-columns: auto 190px;
            gap: 10px 18px;
            align-items: center;
        }
        .botones {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .botones-columna {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 220px;
        }
        button {
            padding: 10px 18px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #2ecc71;
            color: #10131f;
        }
        button.secundario {
            background: #3d4560;
            color: #fff;
        }
        button.peligro {
            background: #c0392b;
            color: #fff;
        }
        button:hover:not(:disabled) {
            filter: brightness(1.1);
        }
        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .error {
            color: #ff7675;
            font-size: 14px;
            min-height: 18px;
            margin: 0;
        }
        .aviso {
            color: #2ecc71;
            font-size: 14px;
            min-height: 18px;
            margin: 0;
        }
        .resultado {
            font-size: 20px;
            margin: 0;
        }
        table {
            border-collapse: collapse;
            min-width: 380px;
        }
        th, td {
            padding: 6px 12px;
            border-bottom: 1px solid #3d4560;
        }
        th {
            color: #2ecc71;
        }
        tr.actual td {
            color: #feca57;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2>Entrenamiento: Pong vs Pared</h2>

    <div class="tablero">
        <!-- Canvas de 800x450 según los requerimientos del proyecto -->
        <canvas id="gameCanvas" width="800" height="450"></canvas>

        <!-- Pantalla de inicio: pide el nombre y la dificultad -->
        <div id="pantallaInicio" class="pantalla">
            <h3>🏓 Pong vs Pared</h3>
            <form id="formInicio" novalidate>
                <label for="nombreJugador">Nombre del jugador</label>
                <input type="text" id="nombreJugador" maxlength="15" autocomplete="off" placeholder="Escribe tu nombre">
                <label for="dificultad">Dificultad inicial</label>
                <select id="dificultad">
                    <option value="facil">Fácil</option>
                    <option value="normal" selected>Normal</option>
                    <option value="dificil">Difícil</option>
                </select>
                <p id="errorNombre" class="error"></p>
                <button type="submit">¡Jugar!</button>
                <button type="button" id="btnOpcionesInicio" class="secundario">⚙ Opciones</button>
            </form>
        </div>

        <!-- Pantalla de pausa -->
        <div id="pantallaPausa" class="pantalla oculto">
            <h3>⏸ Pausa</h3>
            <div class="botones-columna">
                <button type="button" id="btnContinuar">▶ Continuar</button>
                <button type="button" id="btnOpcionesPausa" class="secundario">⚙ Opciones</button>
                <button type="button" id="btnSalir" class="secundario">Salir al inicio</button>
            </div>
            <p class="aviso">Pulsa <kbd>P</kbd> o <kbd>Esc</kbd> para continuar</p>
        </div>

        <!-- Pantalla de opciones: personalización (se guarda en el navegador) -->
        <div id="pantallaOpciones" class="pantalla oculto">
            <h3>⚙ Opciones</h3>
            <div class="opciones-grid">
                <label for="optTablero">Color del tablero</label>
                <input type="color" id="optTablero">

                <label for="optPaleta">Color de la paleta</label>
                <input type="color" id="optPaleta">

                <label for="optPelota">Color de la pelota</label>
                <input type="color" id="optPelota">

                <label for="optTamano">Tamaño de la paleta</label>
                <select id="optTamano">
                    <option value="pequena">Pequeña</option>
                    <option value="normal">Normal</option>
                    <option value="grande">Grande</option>
                </select>

                <label for="optControles">Controles</label>
                <select id="optControles">
                    <option value="clasico">W / S y Flechas</option>
                    <option value="ik">I / K</option>
                </select>
            </div>
            <p id="avisoOpciones" class="aviso"></p>
            <div class="botones">
                <button type="button" id="btnVolverOpciones">Volver</button>
                <button type="button" id="btnRestablecer" class="secundario">Restablecer</button>
                <button type="button" id="btnBorrarHistorial" class="peligro">Borrar historial</button>
            </div>
        </div>

        <!-- Pantalla de fin: resultado y los 3 mejores puntajes -->
        <div id="pantallaFin" class="pantalla oculto">
            <h3>¡Perdiste!</h3>
            <p id="resultado" class="resultado"></p>
            <table>
                <thead>
                    <tr><th>#</th><th>Jugador</th><th>Puntos</th><th>Fecha</th></tr>
                </thead>
                <tbody id="tablaHistorial"></tbody>
            </table>
            <div class="botones">
                <button type="button" id="btnReintentar">Jugar de nuevo</button>
                <button type="button" id="btnCambiar" class="secundario">Cambiar jugador</button>
            </div>
        </div>
    </div>

    <div class="barra">
        <p>Controles: <span id="textoControles"></span>. Cada golpe vale <b>+5</b> y cada 3 golpes subes de nivel.</p>
        <button type="button" id="btnPausa" class="secundario" disabled>⏸ Pausa</button>
    </div>

    <script src="game.js"></script>
</body>
</html>
